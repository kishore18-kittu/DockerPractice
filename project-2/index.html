<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker HTML Practice</title>
  <style>
    body { max-width: 680px; margin: 4rem auto; padding: 0 1rem; font: 1.1rem/1.6 system-ui, sans-serif; color: #19324d; }
    main { padding: 2rem; border: 1px solid #d7e2ee; border-radius: 12px; background: #f5f9fd; }
    code { padding: .15rem .35rem; border-radius: 4px; background: #e3edf7; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Docker!</h1>
    <p>This page is served by <strong>Nginx</strong> inside a Docker container.</p>
    <p>Change this file, rebuild the image, and refresh the page to practice.</p>
    <p>Open <code>http://localhost:8080</code> after starting the container.</p>
  </main>
</body>
</html>
